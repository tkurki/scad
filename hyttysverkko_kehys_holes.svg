<svg width="380" height="203" viewBox="0 0 380 203" xmlns="http://www.w3.org/2000/svg">


  <defs>
    <!-- Define a mask for the holes -->
    <mask id="hole-mask">
      <!-- Everything white is visible, everything black is transparent (a hole) -->
      <rect x="0" y="0" width="380" height="203" fill="white" />
      
      <!-- Staggered black circles for the holes.
           They are arranged in rows, with alternating rows shifted. -->
      <g fill="black">
        <!-- Hole radius is 10. Separation is 5.
             Distance between centers is 2 * 10 + 5 = 25.
             Holes are centered within the 340x160 area. -->
        <!-- Row 1 (y = 41.5) -->
        <circle cx="45" cy="41.5" r="10" />
        <circle cx="70" cy="41.5" r="10" />
